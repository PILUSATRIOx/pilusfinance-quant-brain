name: Quant Brain Learning Cycle
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run learning cycle
        run: node runner.js
      - name: Commit updated state
        run: |
          git config user.name "quant-brain-bot"
          git config user.email "quant-brain-bot@users.noreply.github.com"
          git add learning_state.json accuracy_report.json strategy_weights.json trade_journal.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "auto: learning cycle $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push